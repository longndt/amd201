# Render Blueprint — deploys the PRE-BUILT images from Docker Hub (pushed by CI).
# Docs: https://render.com/docs/blueprint-spec
#
# BEFORE using this: replace every YOUR_DOCKERHUB_USERNAME with your Docker Hub user.
# The images are built & pushed by .github/workflows/ci-cd.yml.
#
# DATABASE: Render's free tier does not run SQL Server, so host it externally (e.g. the
# Azure SQL Database free offer) and paste the connection string into the sync:false
# env vars below. See the tutorial, Part I.
services:
  # ----- API Gateway (Ocelot) — the only public entry point for the browser -----
  - type: web
    name: lab-gateway
    runtime: image
    image:
      url: docker.io/YOUR_DOCKERHUB_USERNAME/lab-gateway:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production            # loads ocelot.Production.json
      - key: AllowedOrigins
        sync: false                  # set to your frontend URL
      # Point the gateway at your deployed services (override the Production routes):
      - key: Routes__0__DownstreamHostAndPorts__0__Host
        sync: false                  # e.g. lab-authservice.onrender.com
      - key: Routes__1__DownstreamHostAndPorts__0__Host
        sync: false                  # e.g. lab-productservice.onrender.com
      - key: Routes__2__DownstreamHostAndPorts__0__Host
        sync: false                  # e.g. lab-productservice.onrender.com

  # ----- Auth microservice -----
  - type: web
    name: lab-authservice
    runtime: image
    image:
      url: docker.io/YOUR_DOCKERHUB_USERNAME/lab-authservice:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false                  # your SQL Server connection string
      - key: Jwt__Key
        generateValue: true          # generate a strong secret once…
      - key: Jwt__Issuer
        value: MicroserviceLab
      - key: Jwt__Audience
        value: MicroserviceLabClients

  # ----- Product (CRUD) microservice -----
  - type: web
    name: lab-productservice
    runtime: image
    image:
      url: docker.io/YOUR_DOCKERHUB_USERNAME/lab-productservice:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        fromService:                 # reuse the EXACT key the Auth service generated
          type: web
          name: lab-authservice
          envVarKey: Jwt__Key
      - key: Jwt__Issuer
        value: MicroserviceLab
      - key: Jwt__Audience
        value: MicroserviceLabClients

  # ----- React frontend (nginx image; the gateway URL is baked in at CI build time) -----
  - type: web
    name: lab-frontend
    runtime: image
    image:
      url: docker.io/YOUR_DOCKERHUB_USERNAME/lab-frontend:latest
    plan: free
