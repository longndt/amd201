# Runs the WHOLE stack locally with one command:  docker compose up --build
#
#   frontend (nginx)      -> http://localhost:7080
#   API gateway (Ocelot)  -> http://localhost:7000   (the browser talks only to this)
#   auth service (API)    -> http://localhost:7001   (Swagger at /swagger)
#   product service (API) -> http://localhost:7002   (Swagger at /swagger)
#   sqlserver             -> localhost,14330
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lab-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "14330:1433"
    volumes:
      # Persist database files so your data survives `docker compose down`.
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_password123\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  authservice:
    build: ./services/AuthService
    container_name: lab-authservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the compose network the DB host is "sqlserver" on its internal port 1433.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "super_secret_jwt_signing_key_change_me_at_least_32_chars"
      Jwt__Issuer: "MicroserviceLab"
      Jwt__Audience: "MicroserviceLabClients"
    ports:
      - "7001:8080"

  productservice:
    build: ./services/ProductService
    container_name: lab-productservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False"
      # MUST match the Auth service's JWT settings so tokens validate.
      Jwt__Key: "super_secret_jwt_signing_key_change_me_at_least_32_chars"
      Jwt__Issuer: "MicroserviceLab"
      Jwt__Audience: "MicroserviceLabClients"
    ports:
      - "7002:8080"

  gateway:
    build: ./services/ApiGateway
    container_name: lab-gateway
    depends_on:
      - authservice
      - productservice
    environment:
      # Loads ocelot.Docker.json (routes to authservice / productservice).
      ASPNETCORE_ENVIRONMENT: Docker
      AllowedOrigins: "http://localhost:7080,http://localhost:7173"
    ports:
      - "7000:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # The browser runs on the host, so it reaches the gateway via localhost:7000.
        VITE_API_URL: "http://localhost:7000"
    container_name: lab-frontend
    depends_on:
      - gateway
    ports:
      - "7080:80"

volumes:
  sqldata:
