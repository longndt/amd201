# Runs the WHOLE stack locally with one command:  docker compose up --build
#
#   frontend (nginx)      -> http://localhost:8080
#   auth service (API)    -> http://localhost:5001   (Swagger at /swagger)
#   product service (API) -> http://localhost:5002   (Swagger at /swagger)
#   sqlserver             -> localhost,1433
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lab-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_password123\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  authservice:
    build: ./services/AuthService
    container_name: lab-authservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Note: inside the compose network the DB host is "sqlserver", not localhost.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: "super_secret_jwt_signing_key_change_me_at_least_32_chars"
      Jwt__Issuer: "MicroserviceLab"
      Jwt__Audience: "MicroserviceLabClients"
      AllowedOrigins: "http://localhost:8080,http://localhost:5173"
    ports:
      - "5001:8080"

  productservice:
    build: ./services/ProductService
    container_name: lab-productservice
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True;Encrypt=False"
      # MUST match the Auth service's JWT settings so tokens validate.
      Jwt__Key: "super_secret_jwt_signing_key_change_me_at_least_32_chars"
      Jwt__Issuer: "MicroserviceLab"
      Jwt__Audience: "MicroserviceLabClients"
      AllowedOrigins: "http://localhost:8080,http://localhost:5173"
    ports:
      - "5002:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # The browser runs on the host, so it reaches the APIs via localhost.
        VITE_AUTH_API_URL: "http://localhost:5001"
        VITE_PRODUCT_API_URL: "http://localhost:5002"
    container_name: lab-frontend
    depends_on:
      - authservice
      - productservice
    ports:
      - "8080:80"
