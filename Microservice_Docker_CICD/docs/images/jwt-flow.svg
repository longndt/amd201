<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="920" height="560" fill="#f8fafc"/>
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">JWT Authentication Flow (across two services)</text>

  <!-- Lifelines -->
  <g font-size="14" font-weight="700">
    <rect x="70" y="60" width="150" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="145" y="87" text-anchor="middle" fill="#3730a3">React (Browser)</text>

    <rect x="390" y="60" width="150" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="465" y="87" text-anchor="middle" fill="#065f46">Auth Service</text>

    <rect x="700" y="60" width="150" height="44" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="775" y="87" text-anchor="middle" fill="#92400e">Product Service</text>
  </g>
  <line x1="145" y1="104" x2="145" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="465" y1="104" x2="465" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="775" y1="104" x2="775" y2="520" stroke="#cbd5e1" stroke-width="2"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>

  <!-- 1 login -->
  <line x1="145" y1="150" x2="465" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="305" y="142" text-anchor="middle" font-size="12" fill="#1e293b">1. POST /api/auth/login  { username, password }</text>

  <!-- 2 verify + sign -->
  <rect x="405" y="170" width="120" height="40" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="465" y="187" text-anchor="middle" font-size="11" fill="#065f46">verify hash,</text>
  <text x="465" y="202" text-anchor="middle" font-size="11" fill="#065f46">sign JWT (secret key)</text>

  <!-- 3 return token -->
  <line x1="465" y1="235" x2="145" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="305" y="227" text-anchor="middle" font-size="12" fill="#1e293b">2. 200 OK  { token, expiresAt }</text>

  <!-- 4 store -->
  <rect x="85" y="255" width="120" height="34" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="145" y="277" text-anchor="middle" font-size="11" fill="#3730a3">store in localStorage</text>

  <!-- 5 request products with bearer -->
  <line x1="145" y1="320" x2="775" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="460" y="312" text-anchor="middle" font-size="12" fill="#1e293b">3. GET /api/products   Authorization: Bearer &lt;token&gt;</text>

  <!-- 6 validate -->
  <rect x="715" y="340" width="120" height="40" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="775" y="357" text-anchor="middle" font-size="11" fill="#92400e">validate signature</text>
  <text x="775" y="372" text-anchor="middle" font-size="11" fill="#92400e">with SAME secret key</text>

  <!-- 7 response -->
  <line x1="775" y1="405" x2="145" y2="405" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="460" y="397" text-anchor="middle" font-size="12" fill="#166534">4. 200 OK  [ products ]   (valid token)</text>

  <!-- 8 invalid -->
  <line x1="775" y1="455" x2="145" y2="455" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="460" y="447" text-anchor="middle" font-size="12" fill="#b91c1c">✗ 401 Unauthorized  (missing / invalid / mismatched-key token)</text>

  <text x="460" y="510" text-anchor="middle" font-size="13" fill="#475569">Key insight: the Product service never calls the Auth service — it validates the token locally using the shared key.</text>
</svg>
