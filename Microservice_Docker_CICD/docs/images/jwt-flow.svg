<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1000" height="580" fill="#f8fafc"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">JWT Authentication Flow (through the API Gateway)</text>

  <!-- Lifelines -->
  <g font-size="13" font-weight="700">
    <rect x="40" y="58" width="150" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="115" y="84" text-anchor="middle" fill="#3730a3">React (Browser)</text>

    <rect x="300" y="58" width="150" height="42" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="375" y="84" text-anchor="middle" fill="#7e22ce">API Gateway</text>

    <rect x="560" y="58" width="150" height="42" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="635" y="84" text-anchor="middle" fill="#065f46">Auth Service</text>

    <rect x="810" y="58" width="150" height="42" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="885" y="84" text-anchor="middle" fill="#92400e">Product Service</text>
  </g>
  <line x1="115" y1="100" x2="115" y2="540" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="375" y1="100" x2="375" y2="540" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="635" y1="100" x2="635" y2="540" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="885" y1="100" x2="885" y2="540" stroke="#cbd5e1" stroke-width="2"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>

  <!-- 1 login via gateway -->
  <line x1="115" y1="140" x2="373" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="244" y="132" text-anchor="middle" font-size="11" fill="#1e293b">1. POST /api/auth/login</text>
  <line x1="375" y1="160" x2="633" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="505" y="153" text-anchor="middle" font-size="11" fill="#1e293b">routes to Auth</text>

  <!-- verify + sign -->
  <rect x="575" y="176" width="120" height="38" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="635" y="192" text-anchor="middle" font-size="10" fill="#065f46">verify hash,</text>
  <text x="635" y="206" text-anchor="middle" font-size="10" fill="#065f46">sign JWT (secret key)</text>

  <!-- return token -->
  <line x1="633" y1="238" x2="377" y2="238" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="373" y1="258" x2="117" y2="258" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="244" y="250" text-anchor="middle" font-size="11" fill="#1e293b">2. 200 OK { token }</text>

  <!-- store -->
  <rect x="55" y="274" width="120" height="30" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="115" y="294" text-anchor="middle" font-size="10" fill="#3730a3">store in localStorage</text>

  <!-- request products via gateway -->
  <line x1="115" y1="336" x2="373" y2="336" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="244" y="328" text-anchor="middle" font-size="11" fill="#1e293b">3. GET /api/products</text>
  <text x="244" y="352" text-anchor="middle" font-size="10" fill="#64748b">Authorization: Bearer &lt;token&gt;</text>
  <line x1="375" y1="336" x2="883" y2="336" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="629" y="328" text-anchor="middle" font-size="11" fill="#1e293b">forwards request + header to Product</text>

  <!-- validate -->
  <rect x="825" y="360" width="120" height="38" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="885" y="376" text-anchor="middle" font-size="10" fill="#92400e">validate signature</text>
  <text x="885" y="390" text-anchor="middle" font-size="10" fill="#92400e">with SAME secret key</text>

  <!-- response ok -->
  <line x1="883" y1="422" x2="377" y2="422" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="373" y1="442" x2="117" y2="442" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
  <text x="500" y="414" text-anchor="middle" font-size="11" fill="#166534">4. 200 OK [ products ]  (valid token)</text>

  <!-- invalid -->
  <line x1="883" y1="478" x2="117" y2="478" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="500" y="470" text-anchor="middle" font-size="11" fill="#b91c1c">✗ 401 Unauthorized (missing / invalid / mismatched-key token)</text>

  <text x="500" y="524" text-anchor="middle" font-size="12" fill="#475569">The gateway just routes and forwards the Authorization header — the Product service still validates the JWT itself.</text>
</svg>
