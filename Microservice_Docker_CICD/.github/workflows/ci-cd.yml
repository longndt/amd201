name: CI/CD

# Flow:  build & test  ->  build Docker images & PUSH to Docker Hub  ->  deploy on Render.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1) BUILD the .NET services (gateway + both APIs) --------------------------
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ ApiGateway, AuthService, ProductService ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore services/${{ matrix.service }}/${{ matrix.service }}.csproj
      - name: Build
        run: dotnet build services/${{ matrix.service }}/${{ matrix.service }}.csproj --configuration Release --no-restore

  # 2) UNIT TESTS -------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test: [ AuthService.Tests, ProductService.Tests ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test services/${{ matrix.test }}/${{ matrix.test }}.csproj --configuration Release --verbosity normal

  # 3) BUILD the React frontend ----------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & build
        working-directory: frontend
        run: |
          npm install
          npm run build

  # 4) BUILD Docker images and PUSH to Docker Hub -----------------------------
  # On PRs: images are built to validate the Dockerfiles but NOT pushed.
  # On push to main: images are built AND pushed to Docker Hub.
  docker-push:
    runs-on: ubuntu-latest
    needs: [ build-backend, test-backend, build-frontend ]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push — API Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./services/ApiGateway
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-gateway:${{ github.sha }}

      - name: Build & push — Auth service
        uses: docker/build-push-action@v6
        with:
          context: ./services/AuthService
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-authservice:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-authservice:${{ github.sha }}

      - name: Build & push — Product service
        uses: docker/build-push-action@v6
        with:
          context: ./services/ProductService
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-productservice:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-productservice:${{ github.sha }}

      - name: Build & push — Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          # The frontend talks to the gateway; bake the PUBLIC gateway URL at build time.
          # Add VITE_API_URL as a GitHub repository VARIABLE (Settings → Variables).
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-frontend:${{ github.sha }}

  # 5) DEPLOY on Render (pull the freshly pushed images) ----------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [ docker-push ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploys
        run: |
          echo "Telling Render to pull the new images from Docker Hub…"
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_GATEWAY }}"
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_AUTH }}"
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PRODUCT }}"
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
